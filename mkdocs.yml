site_name: Infrastructure MCP Server
site_description: Unified MCP server for managing Cloudflare, Namecheap, and Fleet infrastructure
site_url: https://infrastructure-mcp.hesketh.pro
repo_url: https://github.com/wrxck/infrastructure-mcp
repo_name: wrxck/infrastructure-mcp

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - def_list
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Configuration: getting-started/configuration.md
    - Authentication: getting-started/authentication.md
  - Tools:
    - Overview: tools/overview.md
    - Cloudflare: tools/cloudflare.md
    - Namecheap: tools/namecheap.md
    - Fleet: tools/fleet.md
  - Domain Onboarding:
    - Workflow: onboarding/workflow.md
    - Protection Settings: onboarding/protection-settings.md
    - DNS Migration: onboarding/dns-migration.md
  - Reference:
    - Environment Variables: reference/env-vars.md
    - Changelog: reference/changelog.md

name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install namecheap-mcp dependency
        run: |
          git clone https://github.com/wrxck/namecheap-mcp.git /tmp/namecheap-mcp
          cd /tmp/namecheap-mcp
          mvn install -DskipTests -q

      - name: Install cloudflare-mcp dependency
        run: |
          git clone https://github.com/wrxck/cloudflare-mcp.git /tmp/cloudflare-mcp
          cd /tmp/cloudflare-mcp
          mvn install -DskipTests -q

      - name: Build and test
        run: mvn clean verify

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: infrastructure-mcp-jar
          path: target/infrastructure-mcp-1.0.0.jar
          retention-days: 30
